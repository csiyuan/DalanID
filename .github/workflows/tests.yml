name: tests

# The suite is the project's own acceptance criterion, so it runs on every
# push and every pull request rather than on a schedule.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        working-directory: backend
        # No DALANID_* variables are set, so this exercises the hardened
        # configuration: demonstration affordances off, DEBUG off.
        run: python manage.py test identity
